server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: face-access-system
  
  # 数据源配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/face_access_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        reset-enable: false
        login-username: admin
        login-password: admin
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:schema.sql

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.demo.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: ${JWT_SECRET:face-access-system-secret-key-change-me}
  expiration: 86400000  # 24小时（毫秒）
  header: Authorization
  prefix: Bearer 

# 文件存储配置
file:
  upload-path: ${FILE_UPLOAD_PATH:./uploads/}
  face-image-path: ${file.upload-path}face/
  snapshot-path: ${file.upload-path}snapshot/
  avatar-path: ${file.upload-path}avatar/

# 人脸识别配置
face:
  recognition:
    threshold: 0.80  # 默认距离阈值（工程推荐区间 0.80~0.85）
    max-templates-per-user: 5
    feature-version: v1.6-tta-flip-auto
    python-command: python3
    model-dir: ${FACE_MODEL_DIR:../facenet-pytorch-main}
    bridge-script: bridge_api.py
    timeout: 120000  # 模型调用超时时间（毫秒）

attendance:
  work-start-time: 09:00
  check-out-start-time: 12:00
  work-end-time: 18:00

# 日志配置
logging:
  level:
    root: INFO
    com.example.demo: DEBUG
    com.example.demo.mapper: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ./logs/face-access-system.log
    max-size: 10MB
    max-history: 30
